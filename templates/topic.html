{% extends "base.html" %}{% block content %}<section class="panel"><h1>{{"Edit" if topic else "Add"}} health topic</h1><form method="post"><label>English name<input name="name" required value="{{topic.name if topic else ''}}"></label><label>Hindi name<input name="name_hi" required value="{{topic.name_hi if topic else ''}}"></label><label>Keywords (comma separated)<input name="keywords" required value="{{topic.keywords if topic else ''}}"></label><label>English summary<textarea name="summary" required>{{topic.summary if topic else ''}}</textarea></label><label>Hindi summary<textarea name="summary_hi" required>{{topic.summary_hi if topic else ''}}</textarea></label><label>English tips (one per line)<textarea name="tips" required>{{topic.tips if topic else ''}}</textarea></label><label>Hindi tips (one per line)<textarea name="tips_hi" required>{{topic.tips_hi if topic else ''}}</textarea></label><label>When to seek help<textarea name="help" required>{{topic.help if topic else ''}}</textarea></label><label>कब सहायता लें<textarea name="help_hi" required>{{topic.help_hi if topic else ''}}</textarea></label><button class="primary">Save topic</button></form></section>{% endblock %}
